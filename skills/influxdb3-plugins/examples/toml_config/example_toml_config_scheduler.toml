# Example TOML config consumed by example_toml_config.py.
#
# Deployment encodes this file in config_toml_b64. The plugin explicitly
# decodes it and parses TOML; the engine passes the argument as a string.

# Threshold for alerting (the TOML parser returns an int)
threshold = 75

# Optional label included in log output
label = "demo-trigger"

# Nested table — comes through as a Python dict in args["severity_levels"]
[severity_levels]
warn = 70
alert = 90
