# Example TOML config consumed by example_toml_config.py.
#
# Copy this file into PLUGIN_DIR. The trigger passes its name in
# config_file_path, and the plugin reads and parses it.

# Threshold for alerting (the TOML parser returns an int)
threshold = 75

# Optional label included in log output
label = "demo-trigger"

# The plugin's TOML parser returns this nested table as config["severity_levels"].
[severity_levels]
warn = 70
alert = 90
