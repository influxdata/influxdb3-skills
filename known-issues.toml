[[issue]]
id = "core-resources-exhausted-500"
summary = "A query that exhausts the memory pool returns 500, not 429, on Core"
affects = { influxdb3-core = "3.12" }
verified_on = { influxdb3-core = "3.12.0" }
evidence = "Core source at v3.12.0 maps ResourcesExhausted to 500; not reproduced live"
