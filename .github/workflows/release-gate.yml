name: Release gate

# Runs the live examples and scores the committed eval evidence before a release.
# Maintainers run the eval suite locally and commit the results to evals/evidence/.
# Decision record: docs/decisions/0002-evals-release-gate.md

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-trigger:
    name: Should the gate run?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          HAS_RELEASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          if [[ "$EVENT" != pull_request || "$HAS_RELEASE_LABEL" == true ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Read the InfluxDB 3 version the docs were checked against
        run: |
          version=$(sed -n 's/.*docs_checked_against: "influxdb3-core \([0-9.]*\),.*/\1/p' skills/influxdb3/SKILL.md)
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  examples:
    name: Examples on InfluxDB 3 Core ${{ needs.gate-trigger.outputs.version }}
    needs: gate-trigger
    if: needs.gate-trigger.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate-trigger.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Start InfluxDB 3 Core
        run: |
          docker run -d --name core -p 8181:8181 "influxdb:${VERSION}-core" \
            serve --node-id ci --object-store memory
          for _ in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8181/health || true)
            [[ "$status" == 401 ]] && break
            sleep 1
          done
      - name: Create the operator token
        id: token
        run: |
          token=$(docker exec core influxdb3 create token --admin --format json | jq -r .token)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - name: Run the examples
        env:
          INFLUXDB_HOST: http://127.0.0.1:8181
          INFLUXDB_TOKEN: ${{ steps.token.outputs.token }}
          PRODUCT: core
          OUT: ${{ runner.temp }}/example-logs
        run: evals/run-examples.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-logs
          path: ${{ runner.temp }}/example-logs
          if-no-files-found: ignore

  gate:
    name: Release gate
    needs: [gate-trigger, examples]
    if: always() && needs.gate-trigger.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Examples passed
        env:
          EXAMPLES: ${{ needs.examples.result }}
        run: test "$EXAMPLES" == success
      - name: Evidence matches the release
        id: evidence
        run: |
          dir="evals/evidence/v$(jq -r .version plugin.json)"
          manifest="$dir/manifest.json"
          test -s "$manifest" || { echo "::error::missing $manifest"; exit 1; }
          # The evidence must cover the skills and prompts being released.
          skills=$(jq -r .skills_tree "$manifest")
          prompts=$(jq -r .prompts_blob "$manifest")
          [[ -n "$skills" && "$(git rev-parse HEAD:skills)" == "$skills"* ]] \
            || { echo "::error::$manifest skills_tree $skills doesn't match skills/ at HEAD"; exit 1; }
          [[ -n "$prompts" && "$(git rev-parse HEAD:evals/prompts.jsonl)" == "$prompts"* ]] \
            || { echo "::error::$manifest prompts_blob $prompts doesn't match evals/prompts.jsonl at HEAD"; exit 1; }
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
      - name: Score the evidence
        env:
          DIR: ${{ steps.evidence.outputs.dir }}
        run: |
          args=()
          while read -r file; do args+=(--claude "$DIR/$file"); done < <(jq -r '.claude[].file' "$DIR/manifest.json")
          while read -r file; do args+=(--codex "$DIR/$file"); done < <(jq -r '.codex[]?.file' "$DIR/manifest.json")
          node evals/gate.mjs "${args[@]}"
