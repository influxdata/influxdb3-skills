name: Release gate

# Verifies skill-changing PRs before main consumption, plus tags and manual runs.
# Maintainers run the eval suite locally and commit the results to evals/evidence/.
# Decision record: docs/decisions/0002-evals-release-gate.md

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-trigger:
    name: Should the gate run?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: check
        run: node evals/gate-trigger.mjs
      - id: version
        if: steps.check.outputs.run == 'true'
        name: Read the exact Core example target
        run: |
          version=$(jq -er '.core_version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "evals/evidence/v$(jq -r .version plugin.json)/manifest.json")
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  examples:
    name: Examples on InfluxDB 3 Core ${{ needs.gate-trigger.outputs.version }}
    needs: gate-trigger
    if: needs.gate-trigger.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate-trigger.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Start InfluxDB 3 Core
        run: |
          docker run -d --name core -p 8181:8181 "influxdb:${VERSION}-core" \
            serve --node-id ci --object-store memory
          for _ in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8181/health || true)
            [[ "$status" == 401 ]] && break
            sleep 1
          done
      - name: Create the operator token
        id: token
        run: |
          token=$(docker exec core influxdb3 create token --admin --format json | jq -r .token)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - name: Run the examples
        env:
          INFLUXDB_HOST: http://127.0.0.1:8181
          INFLUXDB_TOKEN: ${{ steps.token.outputs.token }}
          PRODUCT: core
          OUT: ${{ runner.temp }}/example-logs
        run: evals/run-examples.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-logs
          path: ${{ runner.temp }}/example-logs
          if-no-files-found: ignore

  gate:
    name: Release gate
    needs: [gate-trigger, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Gate trigger completed
        env:
          TRIGGER: ${{ needs.gate-trigger.result }}
        run: test "$TRIGGER" == success
      - name: Examples passed
        if: needs.gate-trigger.outputs.run == 'true'
        env:
          EXAMPLES: ${{ needs.examples.result }}
        run: test "$EXAMPLES" == success
      - name: Validate and score exact-content evidence
        if: needs.gate-trigger.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node evals/verify-evidence.mjs
